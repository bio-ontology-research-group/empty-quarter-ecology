[project]
name = "eq-amplicon"
version = "0.1.0"
description = "Reproducibility package for the Empty Quarter amplicon ecology paper."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-bio>=0.6",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "biopython>=1.83",
    "pyyaml>=6",
    "tqdm>=4.66",
    "pyarrow>=14",
    "geopy>=2.4",
    "umap-learn>=0.5",
    "networkx>=3.2",
    "ete3>=3.1",
    "jupyter>=1",
    "ipykernel>=6",
    "nbformat>=5.10",
    "pyinaturalist>=0.20",
    "requests>=2.31",
    "rpy2>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eq"]

[tool.ruff]
line-length = 100
target-version = "py310"
